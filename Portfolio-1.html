<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ismail | Portfolio</title>
<style>
:root{--bg:#eef2f6;--ink:#0b1b2b;--mute:#52627a;--blue:#2f5bea;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:auto;padding:0 20px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0}
.hero{padding:96px 0 56px}
.hero h1{font-size:clamp(2.6rem,9vw,4.5rem);line-height:1.05;letter-spacing:-.02em}
.hero p{color:var(--mute);max-width:34ch;font-size:1.2rem}
a{color:var(--blue)}
.btn{display:inline-block;background:var(--ink);color:#fff;padding:12px 22px;border-radius:6px;text-decoration:none;font-weight:600}
.btn:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
section{padding:36px 0;border-top:1px solid #cfd8e3}
h2{font-size:1.7rem;margin-bottom:16px}
.tags{display:flex;flex-wrap:wrap;gap:8px;padding:0;list-style:none;margin:0}
.tags li{background:var(--card);border:1px solid #cfd8e3;padding:5px 14px;border-radius:4px}
.proj{display:block;background:var(--card);padding:20px;border-radius:10px;margin-bottom:14px;color:inherit;text-decoration:none;border-left:4px solid var(--blue)}
.proj:hover{background:#f8faff}
.proj p{margin:6px 0;color:var(--mute)}
.proj small{color:var(--blue);font-weight:600}
footer{padding:32px 0 56px;color:var(--mute)}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.25.6/babel.min.js"></script>
<script type="text/babel">
// Edit your data here
const data = {
  name: "Ismail",
  title: "Computer Science student in Egypt, building full stack and AI projects.",
  about: "I study Software Engineering, Artificial Intelligence and Full Stack Web Development. I like turning coursework into projects that actually run.",
  skills: ["React", "Node.js", "NestJS", "SQL", "Python", "Git"],
  projects: [
    { name: "Mini ERP", desc: "Products, customers, orders and a dashboard, with stock deducted on every order.", tech: "Node.js, Express, SQLite", link: "#" },
    { name: "Airbnb Clone Database", desc: "Team project: a 30-table schema covering users, properties, bookings and payments.", tech: "SQL", link: "#" },
    { name: "NestJS CRUD API", desc: "Categories, Customers and Products modules with one consistent CRUD structure.", tech: "NestJS", link: "#" }
  ],
  email: "your@email.com",
  github: "https://github.com/your-username",
  linkedin: "https://linkedin.com/in/your-username"
};

function App() {
  const d = data;
  return (
    <main>
      <header className="hero">
        <h1>{d.name}</h1>
        <p>{d.title}</p>
        <a className="btn" href="#contact">Get in touch</a>
      </header>
      <section>
        <h2>About</h2>
        <p>{d.about}</p>
      </section>
      <section>
        <h2>Skills</h2>
        <ul className="tags">{d.skills.map(s => <li key={s}>{s}</li>)}</ul>
      </section>
      <section>
        <h2>Projects</h2>
        {d.projects.map(p => (
          <a className="proj" key={p.name} href={p.link}>
            <h3>{p.name}</h3>
            <p>{p.desc}</p>
            <small>{p.tech}</small>
          </a>
        ))}
      </section>
      <section id="contact">
        <h2>Contact</h2>
        <p><a href={"mailto:" + d.email}>{d.email}</a></p>
        <p><a href={d.github}>GitHub</a> and <a href={d.linkedin}>LinkedIn</a></p>
      </section>
      <footer>© {new Date().getFullYear()} {d.name}</footer>
    </main>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
